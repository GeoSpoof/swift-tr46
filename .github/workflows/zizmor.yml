name: Workflow security
# zizmor: static analysis of this repo's workflows (template injection, credential persistence,
# cache poisoning, unpinned actions and images, over-broad permissions). Fails on medium or higher.
#
# No path filter: this is a required check, and a filtered workflow never reports on a pull
# request that doesn't touch .github/, which would leave that pull request blocked.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # advanced-security: false reports findings in the log and fails the job, instead of
      # uploading SARIF, which would need security-events: write.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: "1.30.1"
          advanced-security: false
          min-severity: medium
