name: CodeQL
# Static analysis of the Swift sources. Runs on every pull request and push to main, plus weekly,
# so updated query packs re-examine code that hasn't changed.
#
# Xcode is pinned here rather than taken as the newest on the image. CodeQL only analyzes the
# Swift versions its bundle supports: codeql-action v4.38.2 uses CodeQL 2.27.1, which supports
# Swift 5.4 to 6.3. Xcode 26.6 ships Swift 6.3.3 and is the newest Xcode on macos-26 as of
# November 2026; Xcode 27 ships Swift 6.4, which that bundle doesn't support. Move this to a newer
# Xcode only once the codeql-action pin is on a bundle that supports its Swift.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Mondays 07:00 UTC.
    - cron: "0 7 * * 1"

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (Swift)
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 26.6
        env:
          XCODE: /Applications/Xcode_26.6.app
        run: |
          set -euo pipefail
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      # CodeQL traces this build to extract the code. The library target is all of the shipped
      # code; the tests and the benchmark are left out.
      - name: Build
        run: swift build --arch arm64
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:swift"
